<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*

        Tagname|classname|id
        property:value;
        property:value;
        
        */
        h1{
            background-color: green;
            color:white;
        }
        h2{
            background-color: blue;
            color: white;
            border:2px solid black ;
        }  
        .heading{
            background-color: yellow;
            color:blue;
        }
        .bg-danger{
            background-color: red;
        }
        .border-success{
            border:2px solid green;
        }

        .bg-primary{
            background-color:blue ;
        }
        .text-white{
            color: white;
        }
/* red=>danger,green=>success,yellow=>warning,blue=>primary */
    </style>
</head>
<body>
    <h1>Internal css</h1>

    <h2>Welcome to  css journey</h2>

    <h1 class="heading">python Django</h1>

    <h1 class="bg-danger border-success">DjangoRestFramework</h1>

    <h1 class="bg-primary text-white">ASP.NET</h1>
</body>
</html>
